<!DOCTYPE html>
<html>
<head>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; margin: 0; padding: 12px; padding-top: 80px; font-size: 13px; background: #2b2b2b; color: #fff; letter-spacing: 1%; }
    h2 { font-size: 14px; margin: 0 0 12px; }


    .col { display: flex; flex-direction: column; gap: 4px; }
    .row { display: flex; gap: 8px; }

    /* Fixed top bar: scan + threshold */
    .controls {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; flex-direction: column; gap: 10px;
      padding: 12px; border-bottom: 1px solid #4f4f4f; background: #2b2b2b; z-index: 10;
    }
    .controls-top { display: flex; align-items: center; gap: 8px; }
    .threshold-row { display: flex; align-items: center; gap: 8px; }
    .threshold-row label { font-size: 11px; color: #888; white-space: nowrap; }
    .threshold-value { font-size: 11px; color: #c7c7c7; min-width: 62px; text-align: right; font-weight: 600; }

    #summary { flex: 1; font-size: 12px; color: #c7c7c7; }
    #status { color: #c7c7c7; font-size: 12px; padding: 12px 0 4px; }
    #idle { color: #888; font-size: 12px; padding: 24px 0; text-align: center; }

    /* Asset card */
    .asset-item { border-bottom: 1px solid #4f4f4f; padding: 12px 0; }
    .asset { display: flex; justify-content: space-between; gap: 8px;}
    .asset-head { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; flex: 0 0 auto; }
    .asset-thumb {
      width: 110px; height: 80px; border-radius: 4px; object-fit: cover;
      background: #3a3a3a; flex-shrink: 0; cursor: pointer; border: 1px solid transparent;
      display: none; /* hidden until bytes arrive, then .show toggles display:block */
    }
    .asset-thumb.show {
      display: block;
    }
    /* While bytes load, show a spinner and suppress the native broken-image glyph. */
    .asset-loading {
      width: 110px; height: 80px; border-radius: 4px; flex-shrink: 0;
      background: #3a3a3a; position: relative; overflow: hidden;
    }
    .asset-loading::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(120deg, transparent 25%, #484848 50%, transparent 75%);
      transform: translateX(-100%);
      animation: shimmer 1s linear infinite;
    }
    .asset-loading.hide { display: none; }
    @keyframes shimmer { to { transform: translateX(100%); } }

    .asset-meta { font-size: 12px; color: #fff; display: flex; align-items: center; gap: 6px; min-width: 0; padding-bottom: 8px; }
    .asset-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .fmt-badge {
      flex-shrink: 0; font-size: 9px; font-weight: 600; letter-spacing: 1%;
      padding: 1px 5px; border-radius: 3px; background: #444; color: #c7c7c7;
      text-transform: uppercase;
    }
    .fmt-badge.png { background: #5a4a1f; color: #f0c674; cursor: help; }
    .bg-opt { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #fff; font-family: 'Inter'; white-space: nowrap; flex-shrink: 0; cursor: pointer; }
    .bg-opt input[type="color"] {
      -webkit-appearance: none; appearance: none; width: 18px; height: 18px;
      padding: 0; border: 1px solid #666; border-radius: 99px; background: none; cursor: pointer;
    }
    .bg-opt input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .bg-opt input[type="color"]::-webkit-color-swatch { border: none; border-radius: 2px; }
    .asset-slide { font-size: 11px; color: #888; margin-top: 2px; cursor: pointer;}
    .asset-slide:hover { color: #fff; }

    .size-label { font-size: 11px; color: #fff; }
    .asset-size { font-size: 12px; }
    .asset-size.large { color: #fca397; }
    .asset-size.outdated { color: #9d383880; font-weight: 400; }

    .est { font-size: 12px; color: #2da44e; font-weight: 600; }

    .arrow { font-size: 11px; color: #2da44e; }

    /* Slider + buttons row */
    .controls-col { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1 1 auto; min-width: 0; max-width: 346px; }
    .estimate-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; }
    .estimate-row-slider { display: flex; flex-direction: column; justify-content: space-between; gap: 8px; width: 100%; }

    input[type="range"] { -webkit-appearance: none; appearance: none; flex: 1; background: transparent; max-width: 300px; }
    input[type="range"]::-webkit-slider-runnable-track { background: #777; height: 1px; }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; height: 10px; width: 10px; border-radius: 50%;
      border: 1px solid #444; background: #a4a4a4; margin-top: -4px; cursor: pointer;
    }
    input[type="range"]::-moz-range-track { background: #4f4f4f; height: 2px; }
    input[type="range"]::-moz-range-thumb {
      height: 10px; width: 10px; border-radius: 50%; border: 1px solid #444; background: #a4a4a4; cursor: pointer;
    }
    /* Threshold slider slightly bolder */
    #threshold::-webkit-slider-runnable-track { background: #5a5a5a; height: 2px; }
    #threshold::-webkit-slider-thumb { background: #6b9eff; margin-top: -5px; height: 12px; width: 12px; }

    .quality-label { font-size: 11px; color: #c7c7c7; min-width: 34px; }

    .buttons-wrapper { display: flex; flex-direction: column; gap: 8px; }
    .btn-group { display: flex; gap: 8px; justify-content: flex-end; width: 100%; }

    .btn { padding: 4px 8px; font-size: 12px; color: white; background: transparent; border: none; border-bottom: 1px solid #4f4f4f; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .btn:hover { background-color: #444; }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn.secondary { border: 1px solid #444; border-radius: 4px;}
    .btn.primary { background-color: #f65009; border-radius: 4px;}

    .video-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #4f4f4f; }
    .video-thumb { width: 48px; height: 36px; border-radius: 4px; background: #222; display: flex; align-items: center; justify-content: center; color: white; font-size: 16px; flex-shrink: 0; }
    .video-info .name { font-size: 12px; color: #c7c7c7; }
    .video-info .meta { font-size: 11px; color: #666; margin-top: 2px; }
    .section-label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 1%; padding: 16px 0 4px; }

    /* ── Inline preview panel (expands inside a row) ── */
    .preview { display: flex; gap: 8px; padding-top: 8px; }
    .preview-col { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .preview-img { width: 100%; height: 550px; object-fit: contain; border-radius: 4px; background: #1a1a1a; }
    .preview-ph {
      width: 100%; height: 550px; border-radius: 4px; background: #1a1a1a;
      display: flex; align-items: center; justify-content: center;
      color: #555; font-size: 11px; text-align: center; padding: 0 8px;
    }
    .preview-label { font-size: 10px; color: #666; text-align: center; }
    .preview-size { font-size: 12px; font-weight: 600; text-align: center; }
    .preview-size.large { color: #fca397; }
    .preview-size.ok { color: #c7c7c7; }
    .preview-size.green { color: #2da44e; }
  </style>
</head>
<body>

  <div class="controls">
    <div class="controls-top">
      <button class="btn secondary" onclick="scan()">Scan all slides</button>
      <span id="summary"></span>
      <button class="btn" id="collapse-btn" onclick="collapsePreviews()" style="display:none">Shrink view ↙</button>
    </div>
    <div class="threshold-row" id="threshold-controls" style="display:none">
      <label>Flag images over</label>
      <input type="range" id="threshold" min="0" max="2000" value="2000" step="50" oninput="onThresholdChange()" />
      <span class="threshold-value" id="threshold-value">2000 KB</span>
    </div>
  </div>

  <div id="status" style="display:none"></div>
  <div id="idle">Click “Scan all slides” to find every image in the file.</div>
  <div id="list"></div>

  <canvas id="canvas" style="display:none"></canvas>

  <script>
    // Metadata for every image in the file (bytes fetched lazily).
    const assets = [];
    const videos = [];
    // Lookup by assetKey for convenience in event handlers and message handling; kept in sync with assets[].
    const byKey = {};                 // assetKey -> asset
    const pendingBytes = {};          // assetKey -> { resolve, reject } for in-flight getBytes
    const debounceTimers = {};
    let threshold = 2000;              // KB — must match the slider's value="" in the markup
    let scanDone = false;

    // Plugin window sizes: default (dashboard only) and enlarged (while a preview is open).
    const DEFAULT_SIZE = { width: 400, height: 600 };
    const ENLARGED_SIZE = { width: 1200, height: 1200 };
    function resizePlugin(w, h) {
      parent.postMessage({ pluginMessage: { type: 'resize', width: w, height: h } }, '*');
    }

    // ── Byte helpers ───────────────────────────────────────────
    function bytesToBlobUrl(bytes) {
      return URL.createObjectURL(new Blob([new Uint8Array(bytes)], { type: 'image/png' }));
    }

    // Request the raw bytes for one image on demand; cached after first fetch.
    function ensureBytes(asset) {
      if (asset._bytes) return Promise.resolve(asset._bytes);
      if (asset._bytesPromise) return asset._bytesPromise;
      asset._bytesPromise = new Promise((resolve, reject) => {
        pendingBytes[asset.assetKey] = { resolve, reject };
        parent.postMessage({ pluginMessage: {
          type: 'getBytes', assetKey: asset.assetKey, nodeId: asset.nodeId, fillIndex: asset.fillIndex
        } }, '*');
      });
      return asset._bytesPromise;
    }

    // Compress image bytes via Canvas. Resolves { bytes, dataUrl } or rejects on decode failure.
    // bgColor: JPEG has no alpha, so transparent PNG areas encode as black. When a color is
    // given, paint the canvas that color first so transparency flattens to it instead.
    function compressBytes(bytes, quality, bgColor) {
      return new Promise((resolve, reject) => {
        const url = bytesToBlobUrl(bytes);
        const img = new Image();
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not decode image')); };
        img.onload = () => {
          const canvas = document.getElementById('canvas');
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          const ctx = canvas.getContext('2d');
          if (bgColor) {
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
          }
          ctx.drawImage(img, 0, 0);
          canvas.toBlob((outBlob) => {
            if (!outBlob) { URL.revokeObjectURL(url); reject(new Error('Canvas encode failed')); return; }
            outBlob.arrayBuffer().then(buf => {
              URL.revokeObjectURL(url);
              const compressedBytes = Array.from(new Uint8Array(buf));
              const reader = new FileReader();
              reader.onload = (e) => resolve({ bytes: compressedBytes, dataUrl: e.target.result });
              reader.readAsDataURL(outBlob);
            });
          }, 'image/jpeg', quality / 100);
        };
        img.src = url;
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    // ── Scan ────────────────────────────────────────────────────
    function scan() {
      assets.length = 0; videos.length = 0;
      // reset step at the start of a new scan
      for (const k in byKey) delete byKey[k];
      // reset UI state
      scanDone = false;
      document.getElementById('list').innerHTML = '';
      document.getElementById('idle').style.display = 'none';
      document.getElementById('threshold-controls').style.display = 'none';
      document.getElementById('summary').textContent = '';
      document.getElementById('status').style.display = 'block';
      // TODO: better UI to indicate incremental progress during scan, especially for large files; right now we just show a static message until the end.
      document.getElementById('status').textContent = 'Scanning all slides…';
      // Any open previews are gone once rows are rebuilt — restore the default window size.
      resizePlugin(DEFAULT_SIZE.width, DEFAULT_SIZE.height);
      document.getElementById('collapse-btn').style.display = 'none';
      parent.postMessage({ pluginMessage: { type: 'scan' } }, '*');
    }

    function onThresholdChange() {
      threshold = parseInt(document.getElementById('threshold').value);
      document.getElementById('threshold-value').textContent = threshold + ' KB';
      resizePlugin(DEFAULT_SIZE.width, DEFAULT_SIZE.height);
      render();
    }

    // ── Render the filtered, size-sorted list ──────────────
    function render() {
      const list = document.getElementById('list');
      list.innerHTML = '';

      const flaggedLargeImages = assets
        .filter(a => a.sizeKB > threshold)
        .sort((a, b) => b.sizeKB - a.sizeKB);

      document.getElementById('summary').textContent =
        `${flaggedLargeImages.length} of ${assets.length} image${assets.length !== 1 ? 's' : ''} over ${threshold} KB`;

      for (const largeImage of flaggedLargeImages) list.appendChild(buildImageRow(largeImage));

      if (videos.length) {
        const label = document.createElement('div');
        label.className = 'section-label';
        label.textContent = `${videos.length} video${videos.length !== 1 ? 's' : ''} (cannot compress)`;
        list.appendChild(label);
        for (const v of videos) list.appendChild(buildVideoRow(v));
      }
    }

    function buildImageRow(asset) {
      const div = document.createElement('div');
      div.className = 'asset-item';
      div.id = 'asset-' + asset.assetKey;
      const key = asset.assetKey;
      const done = asset._done;

      div.innerHTML = `
        <div class="asset-meta">
          <span class="asset-name">${escapeHtml(asset.nodeName)}</span>
          ${asset.format ? `<span class="fmt-badge ${asset.format === 'PNG' ? 'png' : ''}"${asset.format === 'PNG' ? ' title="Transparent areas may turn black when compressed to JPEG"' : ''}>${escapeHtml(asset.format)}</span>` : ''}
        </div>
        <div class="asset">
          <div class="asset-head">
            <div class="asset-loading" id="asset-loading-${key}" title="Click to jump to this slide"></div>
            <img class="asset-thumb" id="thumb-${key}" title="Click to jump to this slide" />
            <div class="asset-slide" title="Jump to slide"> ↳ Jump to slide ${escapeHtml(asset.slideName)}</div>
          </div>
          <div class="controls-col" id="controls-${key}" style="${done ? 'display:none' : ''}">
            <div class="estimate-row">
              <div class="col">
                <span class="size-label">Original:</span>
                <span class="asset-size ${asset.sizeKB > threshold ? 'large' : 'ok'}" id="size-${key}">${asset.sizeKB} KB</span>
              </div>
              <div class="col">
                <span class="size-label">Estimated:</span>
                <span class="est" id="est-${key}">—</span>
              </div>
            </div>
            <div class="estimate-row-slider">
              <div class="row">
                <label class="size-label" for="slider-${key}">Compression Quality:</label> <span class="quality-label" id="label-${key}">100%</span>
              </div>
              <input type="range" min="10" max="100" value="100" id="slider-${key}" oninput="onSliderChange('${key}')" />
            </div>
            <div class="estimate-row">
              ${asset.format === 'PNG' ? `<label class="bg-opt" title="Fill transparent areas with this color so they don't turn black in JPEG">Background Color: <input type="color" id="bg-${key}" value="#ffffff" oninput="onBgChange('${key}')" /></label>` : ''}
            </div>
            <div class="btn-group">
              <button class="btn" id="preview-btn-${key}" onclick="togglePreview('${key}')">Preview ↗</button>
              <button class="btn primary" id="btn-${key}" onclick="compressAsset('${key}')">Compress</button>
            </div>
          </div>
        </div>
        <div class="preview" id="preview-${key}" style="display:none">
          <div class="preview-col">
            <img class="preview-img" id="pv-orig-${key}" />
            <div class="preview-label">Original</div>
            <div class="preview-size ${asset.sizeKB > threshold ? 'large' : 'ok'}" id="pv-orig-size-${key}">${asset.sizeKB} KB</div>
          </div>
          <div class="preview-col">
            <img class="preview-img" id="pv-comp-${key}" style="display:none" />
            <div class="preview-ph" id="pv-comp-ph-${key}">Move the slider to preview</div>
            <div class="preview-label">Compressed</div>
            <div class="preview-size green" id="pv-comp-size-${key}"></div>
          </div>
        </div>
      `;

      // Thumbnail: fetch bytes lazily, and clicking it (or the slide label) navigates.
      const loading = div.querySelector('#asset-loading-' + CSS.escape(key));
      const thumb = div.querySelector('#thumb-' + CSS.escape(key));
      const nav = () => parent.postMessage({ pluginMessage: { type: 'navigate', nodeId: asset.nodeId } }, '*');
      thumb.onclick = nav;
      div.querySelector('.asset-slide').onclick = nav;

      // Spinner (.loading) stays until bytes arrive; onload swaps it for the image,
      // a failure swaps it for a visible warning glyph.
      thumb.onload = () => {thumb.classList.add('show') ; loading.classList.add('hide'); };
      ensureBytes(asset)
        .then(bytes => { thumb.src = bytesToBlobUrl(bytes); })
        .catch(() => { loading.classList.add('hide'); thumb.classList.add('show'); thumb.alt = '⚠'; });

      return div;
    }

    function buildVideoRow(v) {
      const div = document.createElement('div');
      div.className = 'video-row';
      div.innerHTML = `
        <div class="video-thumb">▶</div>
        <div class="video-info">
          <div class="name">${escapeHtml(v.nodeName)}</div>
          <div class="meta">on ${escapeHtml(v.slideName)} — video, cannot compress</div>
        </div>
      `;
      div.querySelector('.video-thumb').style.cursor = 'pointer';
      div.querySelector('.video-thumb').onclick = () =>
        parent.postMessage({ pluginMessage: { type: 'navigate', nodeId: v.nodeId } }, '*');
      return div;
    }

    // ── Slider preview (debounced) ──────────────────────────────
    // Fires on every movement of a row's quality slider. `key` is the asset's
    // assetKey, which is baked into each row's element IDs (slider-<key>,
    // label-<key>, est-<key>) so we can find this row's elements.
    function onSliderChange(key) {
      const quality = parseInt(document.getElementById('slider-' + key).value);  // current slider value, e.g. 80

      // Cheap, synchronous UI updates — run on every pixel of drag so it feels live.
      document.getElementById('label-' + key).textContent = quality + '%';
      document.getElementById('est-' + key).textContent = '…';                   // loading placeholder
      document.getElementById('size-' + key).classList.add('outdated');
      // Debounce the expensive work: compressing is costly (decode → canvas → re-encode),
      // so we don't run it on every tiny drag. Each call cancels the previous pending
      // timer and starts a fresh 300ms one, so compression only fires once the user
      // pauses for 300ms — with the final quality value. debounceTimers is keyed per
      // row so each image debounces independently.
      clearTimeout(debounceTimers[key]);
      debounceTimers[key] = setTimeout(() => generatePreview(key, quality), 300);
    }

    // The background color to flatten transparency onto (PNG rows only, from the color
    // swatch). Non-PNG rows have no picker → null (no fill needed, they have no alpha).
    function bgColorFor(key) {
      const picker = document.getElementById('bg-' + key);
      return picker ? picker.value : null;
    }

    // Re-preview when the background color is changed, at the current quality.
    function onBgChange(key) {
      const quality = parseInt(document.getElementById('slider-' + key).value);
      document.getElementById('est-' + key).textContent = '…';
      clearTimeout(debounceTimers[key]);
      debounceTimers[key] = setTimeout(() => generatePreview(key, quality), 150);
    }

    // Compress this row's image at the given quality, cache the result, update the
    // "→ N KB" estimate, and refresh the inline preview panel live if it's open.
    // Shared by the slider (debounced) and by opening the preview panel.
    async function generatePreview(key, quality) {
      const asset = byKey[key];
      const estEl = document.getElementById('est-' + key);
      const bgColor = bgColorFor(key);
      try {
        const bytes = await ensureBytes(asset);                        // fetch original bytes from code.js on demand (cached after first fetch)
        const result = await compressBytes(bytes, quality, bgColor);   // compress via Canvas at the chosen quality
        const estKB = Math.round(result.bytes.length / 1024);
        if (estEl) estEl.textContent = '→ ' + estKB + ' KB';           // show the real estimated output size

        // Cache the result on the asset so the preview panel and Compress (compressAsset)
        // can reuse it. The cache key is (quality, bgColor) — both must match to reuse.
        asset._cachedBytes = result.bytes;
        asset._cachedDataUrl = result.dataUrl;
        asset._cachedQuality = quality;
        asset._cachedBg = bgColor;

        refreshPreview(key);                                 // push the fresh compressed image into the open panel
      } catch (e) {
        if (estEl) estEl.textContent = '⚠';                  // decode/encode failed — surface a warning
        console.error(e);
      }
    }

    // ── Inline preview panel ────────────────────────────────────
    // Is any row's preview panel currently open?
    function anyPreviewOpen() {
      return assets.some(a => {
        const p = document.getElementById('preview-' + a.assetKey);
        return p && p.style.display !== 'none';
      });
    }

    // Close every open preview panel and shrink the window back to default.
    function collapsePreviews() {
      for (const a of assets) {
        const p = document.getElementById('preview-' + a.assetKey);
        if (p) p.style.display = 'none';
        const b = document.getElementById('preview-btn-' + a.assetKey);
        if (b) b.textContent = 'Preview ↗';
      }
      resizePlugin(DEFAULT_SIZE.width, DEFAULT_SIZE.height);
      document.getElementById('collapse-btn').style.display = 'none';
    }

    // Toggle a row's side-by-side original/compressed panel open or closed.
    function togglePreview(key) {
      const asset = byKey[key];
      if (!asset) return;
      const panel = document.getElementById('preview-' + key);
      const btn = document.getElementById('preview-btn-' + key);
      const isOpen = panel.style.display !== 'none';

      if (isOpen) {                                          // close it
        panel.style.display = 'none';
        btn.textContent = 'Preview';
        // If that was the last open panel, shrink the window back down.
        if (!anyPreviewOpen()) {
          resizePlugin(DEFAULT_SIZE.width, DEFAULT_SIZE.height);
          document.getElementById('collapse-btn').style.display = 'none';
        }
        return;
      }

      panel.style.display = 'flex';                          // open it
      btn.textContent = 'Hide';
      // Enlarge the window so the side-by-side comparison has room, and expose
      // the Shrink button in the top bar.
      resizePlugin(ENLARGED_SIZE.width, ENLARGED_SIZE.height);
      document.getElementById('collapse-btn').style.display = 'block';

      // Load the original lazily into the panel.
      const origImg = document.getElementById('pv-orig-' + key);
      ensureBytes(asset)
        .then(bytes => { origImg.src = bytesToBlobUrl(bytes); })
        .catch(() => { origImg.alt = '⚠'; });

      // Show the compressed side: reuse the cache if it matches the current quality
      // AND background color, otherwise kick off a compression now so the panel isn't empty.
      const quality = parseInt(document.getElementById('slider-' + key).value);
      if (asset._cachedDataUrl && asset._cachedQuality === quality && asset._cachedBg === bgColorFor(key)) {
        refreshPreview(key);
      } else {
        document.getElementById('pv-comp-ph-' + key).textContent = 'Compressing…';
        generatePreview(key, quality);
      }
    }

    // Push the cached compressed image + size into a row's panel, but only if it's open.
    function refreshPreview(key) {
      const panel = document.getElementById('preview-' + key);
      if (!panel || panel.style.display === 'none') return;  // panel closed — nothing to update

      const asset = byKey[key];
      const compImg = document.getElementById('pv-comp-' + key);
      const compSize = document.getElementById('pv-comp-size-' + key);
      const placeholder = document.getElementById('pv-comp-ph-' + key);

      if (asset._cachedDataUrl) {
        compImg.src = asset._cachedDataUrl;
        compImg.style.display = 'block';
        placeholder.style.display = 'none';
        compSize.textContent = Math.round(asset._cachedBytes.length / 1024) + ' KB';
      } else {
        compImg.style.display = 'none';
        placeholder.style.display = 'flex';
        compSize.textContent = '';
      }
    }

    // ── Compress (from the dashboard) ───────────────────────────
    async function compressAsset(key) {
      const asset = byKey[key];
      const quality = parseInt(document.getElementById('slider-' + key).value);
      const btn = document.getElementById('btn-' + key);
      btn.disabled = true;
      btn.textContent = 'Compressing…';

      // Try to reuse the preview's compressed bytes if available, since the user just generated them by moving the slider.
      // If the user clicks "Compress" without moving the slider, or if they moved the slider but compression failed,
      // then we won't have these cached bytes and we'll compress here on demand.
      // In either case we send the same message to code.js with the final compressed bytes to write them back into Figma and update the node's fill.
      const bgColor = bgColorFor(key);
      try {
        let compressedBytes;
        if (asset._cachedBytes && asset._cachedQuality === quality && asset._cachedBg === bgColor) {
          // if available and it matches the current quality + background color
          compressedBytes = asset._cachedBytes;
        } else {
          // do it on the spot: fetch original bytes if we haven't already, and compress at the chosen quality
          const bytes = await ensureBytes(asset);
          const result = await compressBytes(bytes, quality, bgColor);
          compressedBytes = result.bytes;
        }
        parent.postMessage({ pluginMessage: {
          type: 'compress', assetKey: key, nodeId: asset.nodeId, fillIndex: asset.fillIndex, bytes: compressedBytes
        } }, '*');
      } catch (e) {
        console.error(e);
        btn.disabled = false;
        btn.textContent = 'Retry';
      }
      resizePlugin(DEFAULT_SIZE.width, DEFAULT_SIZE.height);
      document.getElementById('collapse-btn').style.display = 'none';
    }

    // ── Messages from code.js ───────────────────────────────────
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'asset') {
        const a = msg.data;
        // If we see the same assetKey again during the same scan, just update the existing entry
        // (e.g. if a node has multiple fills, or if the code sends a duplicate message for some reason)
        // this is safer than replacing it with a new object which could cause issues for in-flight promises and event handlers that reference the original.
        byKey[a.assetKey] = a;
        if (a.type === 'image') assets.push(a);
        else if (a.type === 'video') videos.push(a);
        // During a scan we just collect (scanDone === false); the single render
        // happens on 'done'. This guarded render only fires for assets that arrive
        // AFTER 'done'. The current code.js sends every asset before 'done', so it's
        // effectively dormant today — it's here so the UI stays correct if scanning
        // ever becomes incremental (e.g. per-page batches or a re-sent/updated asset).
        if (scanDone) render();
      }

      else if (msg.type === 'bytes') {
        const p = pendingBytes[msg.assetKey];
        const asset = byKey[msg.assetKey];
        if (asset) asset._bytes = msg.bytes;
        if (p) { p.resolve(msg.bytes); delete pendingBytes[msg.assetKey]; }
      }

      else if (msg.type === 'bytesError') {
        const p = pendingBytes[msg.assetKey];
        const asset = byKey[msg.assetKey];
        if (asset) asset._bytesPromise = null; // allow retry
        if (p) { p.reject(new Error(msg.message)); delete pendingBytes[msg.assetKey]; }
      }

      else if (msg.type === 'error') {
        document.getElementById('status').textContent = msg.message;
        document.getElementById('status').style.display = 'block';
      }

      else if (msg.type === 'compressError') {
        const btn = document.getElementById('btn-' + msg.assetKey);
        if (btn) { btn.disabled = false; btn.textContent = 'Retry'; }
        document.getElementById('status').textContent = msg.message;
        document.getElementById('status').style.display = 'block';
      }

      else if (msg.type === 'compressed') {
        const asset = byKey[msg.assetKey];
        if (asset) {
          asset._done = true;
          asset.sizeKB = msg.newSizeKB;      // reflect the new size in the dashboard/sorting
          asset._bytes = null;               // force a re-fetch if reopened
          asset._bytesPromise = null;
        }
        const btn = document.getElementById('btn-' + msg.assetKey);
        if (btn) { btn.disabled = true; btn.textContent = '✅ Done'; }
        const sizeEl = document.getElementById('size-' + msg.assetKey);
        if (sizeEl) { sizeEl.textContent = msg.newSizeKB + ' KB'; sizeEl.className = 'asset-size ok'; }
        const controls = document.getElementById('controls-' + msg.assetKey);
        if (controls) controls.style.display = 'none';
        const preview = document.getElementById('preview-' + msg.assetKey);
        if (preview) preview.style.display = 'none';
      }

      else if (msg.type === 'done') {
        scanDone = true;
        document.getElementById('status').style.display = 'none';
        document.getElementById('threshold-controls').style.display = 'flex';

        // Default the threshold slider's ceiling to the largest image so the range is meaningful
        // and clamp the current threshold into range.
        const maxKB = assets.reduce((m, a) => Math.max(m, a.sizeKB), 0);
        const slider = document.getElementById('threshold');
        slider.max = Math.max(500, Math.ceil(maxKB / 50) * 50);
        // If the largest image is smaller than the default threshold, move the threshold down to the
        // new ceiling so something is flagged by default. Always re-sync the thumb and the label.
        threshold = Math.min(threshold, parseInt(slider.max));
        slider.value = threshold;
        document.getElementById('threshold-value').textContent = threshold + ' KB';

        if (assets.length === 0 && videos.length === 0) {
          document.getElementById('idle').textContent = 'No images or videos found in this file.';
          document.getElementById('idle').style.display = 'block';
        }
        render();
      }
    };
  </script>
</body>
</html>
