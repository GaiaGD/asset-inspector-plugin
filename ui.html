<!DOCTYPE html>
<html>
<head>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; margin: 0; padding: 12px; padding-top: 52px; font-size: 13px; background: #2b2b2b; color: #fff; }
    h2 { font-size: 14px; margin: 0 0 12px; }

    .controls { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border-bottom: 1px solid #4f4f4f; background: #2b2b2b; z-index: 10; }

    #status { color: #c7c7c7; font-size: 12px; padding: 12px 0 4px; }
    #idle { color: #888; font-size: 12px; padding: 24px 0; text-align: center; }

    /* Asset card */
    .asset { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-bottom: 1px solid #4f4f4f; }
    .asset-name { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #c7c7c7; }

    /* Side-by-side preview (small, in list) */
    .preview-row { display: flex; gap: 8px; }
    .preview-col { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .preview-col img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      border-radius: 4px;
      background: #444;
    }
    .preview-col .preview-img-placeholder {
      width: 100%;
      aspect-ratio: 4/3;
      border-radius: 4px;
      background: #3a3a3a;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 11px;
    }
    .preview-label { font-size: 10px; color: #666; text-align: center; }
    .preview-size { font-size: 11px; font-weight: 600; text-align: center; }
    .preview-size.large { color: #e05252; }
    .preview-size.ok { color: #c7c7c7; }
    .preview-size.estimated { color: #2da44e; }

    /* Slider + buttons row */
    .controls-row { display: flex; align-items: center; gap: 8px; }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      background: transparent;
    }
    input[type="range"]::-webkit-slider-runnable-track { background: #777; height: 1px; }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 10px; width: 10px;
      border-radius: 50%;
      border: 1px solid #444;
      background: #a4a4a4;
      margin-top: -4px;
      cursor: pointer;
    }
    input[type="range"]::-moz-range-track { background: #4f4f4f; height: 2px; }
    input[type="range"]::-moz-range-thumb {
      height: 10px; width: 10px;
      border-radius: 50%;
      border: 1px solid #444;
      background: #a4a4a4;
      cursor: pointer;
    }

    .quality-label { font-size: 11px; color: #c7c7c7; min-width: 30px; }

    .btn { padding: 4px 8px; font-size: 12px; color: white; background: transparent; border: 1px solid #4f4f4f; border-radius: 4px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .btn:hover { background: #444; }
    .btn:disabled { opacity: 0.4; cursor: default; }

    .video-thumb { width: 64px; height: 64px; border-radius: 4px; background: #222; display: flex; align-items: center; justify-content: center; color: white; font-size: 18px; flex-shrink: 0; }
    .video-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #4f4f4f; }
    .video-info .name { font-size: 12px; color: #c7c7c7; }
    .video-info .meta { font-size: 11px; color: #666; margin-top: 2px; }

    /* ── Modal: full-window comparison view ── */
    /* Shown by expanding the plugin window to 800×560 */
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: #2b2b2b;
      flex-direction: column;
      z-index: 100;
    }
    #modal.open { display: flex; }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #4f4f4f;
      flex-shrink: 0;
    }
    .modal-title { font-size: 12px; color: #c7c7c7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; margin-right: 12px; }
    .modal-close { background: none; border: none; color: #888; font-size: 20px; cursor: pointer; line-height: 1; padding: 0; flex-shrink: 0; }
    .modal-close:hover { color: #fff; }

    .modal-body { flex: 1; display: flex; gap: 12px; padding: 16px; overflow: hidden; min-height: 0; }
    .modal-col { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .modal-col img { width: 100%; flex: 1; object-fit: contain; border-radius: 6px; background: #1a1a1a; min-height: 0; }
    .modal-placeholder {
      width: 100%; flex: 1;
      border-radius: 6px;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 12px;
      min-height: 0;
    }
    .modal-label { font-size: 10px; color: #666; text-align: center; flex-shrink: 0; }
    .modal-size { font-size: 13px; font-weight: 600; text-align: center; flex-shrink: 0; }
    .modal-size.large { color: #e05252; }
    .modal-size.ok { color: #c7c7c7; }
    .modal-size.green { color: #2da44e; }
  </style>
</head>
<body>

  <div class="controls">
    <button class="btn" onclick="scan()">Scan selected slide</button>
  </div>

  <div id="status" style="display:none"></div>
  <div id="idle">Select a slide in Figma, then click Scan.</div>
  <div id="list"></div>

  <!-- Modal: expands plugin window to show full-size comparison -->
  <div id="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title"></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-col">
        <img id="modal-original" />
        <div class="modal-label">Original</div>
        <div class="modal-size" id="modal-original-size"></div>
      </div>
      <div class="modal-col">
        <img id="modal-compressed" style="display:none" />
        <div class="modal-placeholder" id="modal-placeholder">Move the slider first to generate a preview</div>
        <div class="modal-label">Compressed</div>
        <div class="modal-size green" id="modal-compressed-size"></div>
      </div>
    </div>
  </div>

  <!-- Hidden canvas for compression processing -->
  <canvas id="canvas" style="display:none"></canvas>

  <script>
    const assets = [];
    const debounceTimers = {};

    // Converts byte array to base64 for <img> display
    function bytesToBase64(bytes) {
      const uint8 = new Uint8Array(bytes);
      let binary = '';
      for (let i = 0; i < uint8.length; i++) binary += String.fromCharCode(uint8[i]);
      return btoa(binary);
    }

    // Compresses image bytes via Canvas API
    // Returns { bytes, dataUrl } — bytes for sending to Figma, dataUrl for preview
    function compressBytes(bytes, quality) {
      return new Promise((resolve) => {
        const format = 'image/jpeg';
        const blob = new Blob([new Uint8Array(bytes)], { type: 'image/png' });
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
          const canvas = document.getElementById('canvas');
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          canvas.toBlob((outBlob) => {
            outBlob.arrayBuffer().then(buf => {
              URL.revokeObjectURL(url);
              const compressedBytes = Array.from(new Uint8Array(buf));
              // Also generate a data URL for the preview image
              const reader = new FileReader();
              reader.onload = (e) => resolve({ bytes: compressedBytes, dataUrl: e.target.result });
              reader.readAsDataURL(outBlob);
            });
          }, format, quality / 100);
        };
        img.src = url;
      });
    }

    function scan() {
      assets.length = 0;
      document.getElementById('list').innerHTML = '';
      document.getElementById('idle').style.display = 'none';
      document.getElementById('status').style.display = 'block';
      document.getElementById('status').textContent = 'Scanning...';
      parent.postMessage({ pluginMessage: { type: 'scan' } }, '*');
    }

    // Opens the full comparison modal — expands the plugin window to 800×560
    function openModal(nodeId) {
      const asset = assets.find(a => a.nodeId === nodeId);
      if (!asset) return;

      // Populate modal
      document.getElementById('modal-title').textContent = asset.nodeName;

      const originalSrc = `data:image/png;base64,${bytesToBase64(asset.bytes)}`;
      document.getElementById('modal-original').src = originalSrc;
      document.getElementById('modal-original-size').textContent = asset.sizeKB + ' KB';
      document.getElementById('modal-original-size').className = 'modal-size ' + (asset.sizeKB > 500 ? 'large' : 'ok');

      // Show compressed preview if slider has been moved
      if (asset._cachedDataUrl) {
        document.getElementById('modal-compressed').src = asset._cachedDataUrl;
        document.getElementById('modal-compressed').style.display = 'block';
        document.getElementById('modal-placeholder').style.display = 'none';
        const estimatedKB = Math.round(asset._cachedBytes.length / 1024);
        document.getElementById('modal-compressed-size').textContent = estimatedKB + ' KB';
      } else {
        document.getElementById('modal-compressed').style.display = 'none';
        document.getElementById('modal-placeholder').style.display = 'flex';
        document.getElementById('modal-compressed-size').textContent = '';
      }

      // Expand plugin window, then show modal
      parent.postMessage({ pluginMessage: { type: 'resize', width: 1200, height: 1200 } }, '*');
      document.getElementById('modal').classList.add('open');
    }

    // Closes the modal and shrinks plugin back to normal size
    function closeModal() {
      document.getElementById('modal').classList.remove('open');
      parent.postMessage({ pluginMessage: { type: 'resize', width: 400, height: 600 } }, '*');
    }

    // Called when slider moves — debounced, updates preview image and estimated size
    function onSliderChange(nodeId) {
      const estimatedSizeEl = document.getElementById('estimated-size-' + nodeId);
      const previewImg = document.getElementById('preview-img-' + nodeId);
      estimatedSizeEl.textContent = '...';

      clearTimeout(debounceTimers[nodeId]);

      debounceTimers[nodeId] = setTimeout(async () => {
        const asset = assets.find(a => a.nodeId === nodeId);
        const quality = parseInt(document.getElementById('slider-' + nodeId).value);
        document.getElementById('label-' + nodeId).textContent = quality + '%';

        console.log(`Previewing ${asset.nodeName} at ${quality}%`);

        // Compress and get both bytes and preview data URL
        const result = await compressBytes(asset.bytes, quality);
        const estimatedKB = Math.round(result.bytes.length / 1024);

        // Update small preview image in the list
        previewImg.src = result.dataUrl;
        previewImg.style.display = 'block';

        // Update estimated size
        estimatedSizeEl.textContent = estimatedKB + ' KB';
        estimatedSizeEl.className = 'preview-size estimated';

        // Cache compressed bytes and dataUrl — reused by Compress button and modal
        asset._cachedBytes = result.bytes;
        asset._cachedDataUrl = result.dataUrl;
        asset._cachedQuality = quality;

        console.log(`Preview ready: ${estimatedKB} KB`);
      }, 300);
    }

    // Compresses and sends to Figma — reuses cached bytes if quality hasn't changed
    async function compressAsset(asset) {
      const quality = parseInt(document.getElementById('slider-' + asset.nodeId).value);
      const btn = document.getElementById('btn-' + asset.nodeId);

      btn.disabled = true;
      btn.textContent = 'Compressing...';

      // Reuse cached bytes from preview if quality matches — avoids re-encoding
      let compressedBytes;
      if (asset._cachedBytes && asset._cachedQuality === quality) {
        console.log(`Using cached bytes for ${asset.nodeName}`);
        compressedBytes = asset._cachedBytes;
      } else {
        console.log(`Re-compressing ${asset.nodeName} at ${quality}%`);
        const result = await compressBytes(asset.bytes, quality);
        compressedBytes = result.bytes;
      }

      parent.postMessage({
        pluginMessage: { type: 'compress', nodeId: asset.nodeId, bytes: compressedBytes }
      }, '*');
    }

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'asset') {
        const asset = msg.data;
        console.log(`Asset received: ${asset.nodeName} | ${asset.type} | ${asset.sizeKB || '—'} KB`);

        if (asset.type === 'image') assets.push(asset);

        document.getElementById('status').style.display = 'none';
        const list = document.getElementById('list');
        const div = document.createElement('div');
        div.id = 'asset-' + asset.nodeId;

        if (asset.type === 'image') {
          div.className = 'asset';
          const originalSrc = `data:image/png;base64,${bytesToBase64(asset.bytes)}`;
          const isLarge = asset.sizeKB > 500;

          div.innerHTML = `
            <div class="asset-name">${asset.nodeName}</div>

            <!-- Side-by-side preview (small) -->
            <div class="preview-row">
              <div class="preview-col">
                <img src="${originalSrc}" />
                <div class="preview-label">Original</div>
                <div class="preview-size ${isLarge ? 'large' : 'ok'}">${asset.sizeKB} KB</div>
              </div>
              <div class="preview-col">
                <img id="preview-img-${asset.nodeId}" style="display:none" />
                <div class="preview-img-placeholder" id="placeholder-${asset.nodeId}">move slider</div>
                <div class="preview-label">Compressed</div>
                <div class="preview-size estimated" id="estimated-size-${asset.nodeId}">—</div>
              </div>
            </div>

            <!-- Quality slider + Preview + Compress buttons -->
            <div class="controls-row">
              <input type="range" id="slider-${asset.nodeId}"
                min="10" max="100" value="100"
                oninput="onSliderChange('${asset.nodeId}')" />
              <span class="quality-label" id="label-${asset.nodeId}">100%</span>
              <button class="btn" onclick="openModal('${asset.nodeId}')">Preview</button>
              <button class="btn" id="btn-${asset.nodeId}"
                onclick="compressAsset(assets.find(a => a.nodeId === '${asset.nodeId}'))">
                Compress
              </button>
            </div>
          `;
        } else {
          // Video row
          div.className = 'video-row';
          div.innerHTML = `
            <div class="video-thumb">▶</div>
            <div class="video-info">
              <div class="name">${asset.nodeName}</div>
              <div class="meta">video — cannot compress</div>
            </div>
          `;
        }

        list.appendChild(div);

        // Hide placeholder once preview image loads
        const previewImg = document.getElementById('preview-img-' + asset.nodeId);
        if (previewImg) {
          previewImg.onload = () => {
            const placeholder = document.getElementById('placeholder-' + asset.nodeId);
            if (placeholder) placeholder.style.display = 'none';
          };
        }
      }

      if (msg.type === 'error') {
        document.getElementById('status').textContent = msg.message;
        document.getElementById('status').style.display = 'block';
      }

      if (msg.type === 'compressed') {
        console.log(`Confirmed: ${msg.nodeId} → ${msg.newSizeKB} KB`);

        const assetEl = document.getElementById('asset-' + msg.nodeId);
        const btn = document.getElementById('btn-' + msg.nodeId);

        if (btn) { btn.disabled = true; btn.textContent = '✅ Done'; }

        if (assetEl) {
          // Update original size column to reflect new compressed size
          const originalSizeEl = assetEl.querySelector('.preview-col .preview-size');
          if (originalSizeEl) {
            originalSizeEl.textContent = (msg.newSizeKB || '—') + ' KB';
            originalSizeEl.className = 'preview-size ok';
          }
          // Hide the slider row
          const controlsRow = assetEl.querySelector('.controls-row');
          if (controlsRow) controlsRow.style.display = 'none';
        }
      }

      if (msg.type === 'done') {
        const count = assets.length;
        document.getElementById('status').textContent = `Scan complete — ${count} image${count !== 1 ? 's' : ''} found.`;
        document.getElementById('status').style.display = 'block';
      }
    };
  </script>
</body>
</html>
